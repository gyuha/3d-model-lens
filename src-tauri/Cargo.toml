[package]
name = "model-lens"
version = "0.1.0"
description = "View glTF / GLB / STL models and measure their dimensions"
authors = ["gyuha"]
edition = "2021"

[lib]
name = "model_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
