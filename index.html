<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Model Lens</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="root">
  <canvas id="canvas" tabindex="0"></canvas>

  <!-- 내비게이션 큐브. 안의 SVG 는 navCube.ts 가 채운다. -->
  <div id="nav-cube"></div>

  <div id="panel" hidden>
    <div class="m-stripe"></div>

    <!-- 애니메이션 재생. 탭이 아니라 고정 행이다 — 그룹이 있는 파일에서만 드러난다.
         216px 패널의 안쪽 폭 192px 를 세 탭 이름이 여백 없이 채워 네 번째 탭이 들어갈 자리가
         없고, 재생/일시정지는 설정 묶음이 아니라 트랜스포트다 (ADR 260905-222900). -->
    <div id="animation-row" hidden>
      <button type="button" class="action" id="animation-toggle">Pause</button>
      <select id="animation-select" aria-label="Animation"></select>
    </div>

    <div class="panel-tabs" role="tablist">
      <button type="button" class="panel-tab" id="tab-measure"
              role="tab" aria-selected="true" aria-controls="measure-body">Measure</button>
      <button type="button" class="panel-tab" id="tab-display"
              role="tab" aria-selected="false" aria-controls="display-body">Display</button>
      <button type="button" class="panel-tab" id="tab-debug"
              role="tab" aria-selected="false" aria-controls="debug-body">Debug</button>
    </div>

    <div class="tab-body" id="measure-body" role="tabpanel" aria-labelledby="tab-measure">
      <label><input type="checkbox" id="toggle-measure" /> Enabled</label>
      <label><input type="checkbox" id="toggle-snap" checked /> Vertex snap</label>
      <div class="panel-row">
        <label for="unit">Unit</label>
        <select id="unit">
          <option value="auto">Auto</option>
          <option value="mm">mm</option>
          <option value="cm">cm</option>
          <option value="m">m</option>
          <option value="in">in</option>
        </select>
      </div>
      <div class="tab-rule"></div>
      <div id="measure-list"></div>
      <div id="measure-actions">
        <span class="state" id="measure-state"></span>
        <button type="button" class="action" id="measure-clear">Clear all</button>
      </div>
    </div>

    <div class="tab-body" id="display-body" hidden role="tabpanel" aria-labelledby="tab-display">
      <label><input type="checkbox" id="toggle-grid" checked /> Grid</label>
      <label><input type="checkbox" id="toggle-axis-lighting" /> Axis lighting</label>
      <label><input type="checkbox" id="toggle-edges" /> Edges</label>
      <label><input type="checkbox" id="toggle-normal-colors" /> Normal colors</label>
      <div class="tab-rule"></div>
      <div class="panel-row">
        <label for="decimals">Decimals</label>
        <input type="number" id="decimals" min="0" max="10" step="1" />
      </div>
      <div class="panel-row">
        <label for="background-select">Background</label>
        <select id="background-select">
          <option value="theme">Theme</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>

    <div class="tab-body" id="debug-body" hidden role="tabpanel" aria-labelledby="tab-debug">
      <label><input type="checkbox" id="toggle-inspector" /> Inspector</label>
      <label><input type="checkbox" id="toggle-inspector-start" /> Open on start</label>
    </div>
  </div>

  <div id="labels"></div>

  <div class="overlay" id="loading">
    <div class="m-stripe"></div>
    <div class="overlay-title">Loading model</div>
    <div class="overlay-detail"></div>
    <div class="overlay-detail" id="loading-progress"></div>
  </div>

  <div class="overlay" id="error" hidden>
    <div class="rule"></div>
    <div class="name"></div>
    <div class="message"></div>
  </div>
</div>
<script type="module" src="/src/webview/main.ts"></script>
</body>
</html>
